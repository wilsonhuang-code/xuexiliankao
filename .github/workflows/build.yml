name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y \
          python3 python3-pip python3-venv \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev libltdl-dev \
          gcc g++ make patch ccache git \
          openjdk-17-jdk wget unzip

    - uses: actions/checkout@v4

    - name: Set up Python
      run: |
        python3 --version
        pip3 install --upgrade pip setuptools wheel
        pip3 install buildozer "cython>=0.29,<0.30"

    - name: Build APK with Buildozer
      timeout-minutes: 90
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        # Let Buildozer download its own SDK/NDK
        rm -rf .buildozer/android/platform/
        buildozer android debug 2>&1 | tee buildozer_log.txt
        exit ${PIPESTATUS[0]}

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: xuexiliankao-apk
        path: bin/*.apk

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: buildozer_log.txt
