name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev libltdl-dev \
          gcc g++ make patch ccache

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer "cython>=0.29,<0.30"

    # Use v4 (latest) - it auto-accepts licenses and installs tools/platform-tools
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false

    - name: Install NDK, build-tools, platforms
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        # Show what's already installed
        echo "=== SDK contents ==="
        ls $ANDROID_SDK_ROOT/
        echo "=== cmdline-tools ==="
        find $ANDROID_SDK_ROOT/cmdline-tools -name "sdkmanager" -type f 2>/dev/null
        # Find sdkmanager (v4 puts it in versioned dir like cmdline-tools/16.0/bin/)
        SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name "sdkmanager" -type f 2>/dev/null | head -1)
        if [ -z "$SDKMANAGER" ]; then
          echo "ERROR: sdkmanager not found anywhere"
          find $ANDROID_SDK_ROOT -type f -name "sdkmanager" 2>/dev/null || true
          exit 1
        fi
        echo "Found sdkmanager at: $SDKMANAGER"
        # Install NDK + build-tools + platform
        yes | $SDKMANAGER "ndk;26.2.11394342" "build-tools;34.0.0" "platforms;android-34" 2>&1
        echo "=== Verify installations ==="
        echo "NDK:"
        ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null || echo "NOT FOUND"
        echo "Build-tools:"
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "NOT FOUND"
        echo "Platforms:"
        ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "NOT FOUND"

    - name: Build APK with Buildozer
      timeout-minutes: 60
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        # Find NDK
        NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | head -1 | tr -d '/')
        if [ -z "$NDK_DIR" ]; then
          echo "ERROR: No NDK directory found"
          ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null || echo "ndk dir empty or missing"
          exit 1
        fi
        export ANDROID_NDK_HOME=$NDK_DIR
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        # Clean previous build
        rm -rf .buildozer/android/platform/build/
        # Build
        buildozer android debug 2>&1 | tee buildozer_log.txt
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "Buildozer exit code: $BUILD_EXIT"
        exit $BUILD_EXIT

    - name: Check build result
      if: always()
      run: |
        echo "=== Buildozer Log (last 200 lines) ==="
        tail -200 buildozer_log.txt 2>/dev/null || echo "No log file"
        echo ""
        echo "=== Searching for APK files ==="
        find . -name "*.apk" 2>/dev/null || echo "No apk found"
        ls -la bin/ 2>/dev/null || echo "No bin directory"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: xuexiliankao-apk
        path: |
          bin/*.apk
          **/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: |
          buildozer_log.txt
