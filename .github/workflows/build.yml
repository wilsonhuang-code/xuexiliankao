name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev libltdl-dev \
          openjdk-17-jdk-headless \
          gcc g++ make patch

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.38

    - name: Set up Android SDK / NDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME=${ANDROID_SDK_ROOT}
        export ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/$(ls ${ANDROID_SDK_ROOT}/ndk/ | head -1)
        buildozer android debug 2>&1 | tee buildozer_log.txt
      env:
        ANDROID_SDK_ROOT: ${{ steps.setup-android.outputs.sdk-root }}

    - name: Check build result
      if: always()
      run: |
        echo "=== Buildozer Log (last 100 lines) ==="
        tail -100 buildozer_log.txt 2>/dev/null || echo "No log file"
        echo ""
        echo "=== bin directory ==="
        ls -la bin/ 2>/dev/null || echo "No bin directory"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: xuexiliankao-apk
        path: bin/*.apk

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: |
          buildozer_log.txt
          .buildozer/
