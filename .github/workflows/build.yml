name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev libltdl-dev \
          gcc g++ make patch ccache

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer "cython>=0.29,<0.30"

    # Use v4 (latest) - it auto-accepts licenses and installs tools/platform-tools
    - name: Setup Android SDK + NDK + Build-tools (ALL pre-installed)
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false

    - name: Install ALL required packages & accept licenses
      run: |
        SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name "sdkmanager" -type f 2>/dev/null | head -1)
        echo "SDKMANAGER=$SDKMANAGER"
        # Accept licenses multiple times (catch all prompts)
        yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null 2>&1 || true
        yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null 2>&1 || true
        yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null 2>&1 || true
        # Install everything buildozer could possibly need
        yes | $SDKMANAGER \
          "ndk;26.2.11394342" \
          "build-tools;34.0.0" \
          "build-tools;37.0.0" \
          "platforms;android-34" \
          "platforms;android-21" \
          "platforms;android-33" \
          --sdk_root=$ANDROID_SDK_ROOT 2>&1
        # Accept again after installing
        yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null 2>&1 || true
        yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null 2>&1 || true
        echo "=== Verify ==="
        ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null
        ls $ANDROID_SDK_ROOT/ndk/ 2>/dev/null
        test -f $ANDROID_SDK_ROOT/build-tools/37.0.0/aidl && echo "aidl v37 OK" || echo "aidl v37 MISSING"

    - name: Configure buildozer.spec to use system SDK
      run: |
        echo "Configuring buildozer.spec with ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        # Replace the placeholder/hardcoded path with actual SDK root
        sed -i "s|android.sdk_path = .*|android.sdk_path = $ANDROID_SDK_ROOT|" buildozer.spec
        echo "=== buildozer.spec relevant lines ==="
        grep -n "sdk_path\|build_tools\|api\|minapi\|targetapi" buildozer.spec

    - name: Build APK with Buildozer
      timeout-minutes: 60
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        # Find NDK
        NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | head -1 | tr -d '/')
        if [ -z "$NDK_DIR" ]; then
          echo "ERROR: No NDK directory found"
          exit 1
        fi
        export ANDROID_NDK_HOME=$NDK_DIR
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        # Clean previous build
        rm -rf .buildozer/android/platform/build/
        # Build with verbose output
        buildozer android debug 2>&1 | tee buildozer_log.txt
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "Buildozer exit code: $BUILD_EXIT"
        exit $BUILD_EXIT

    - name: Check build result
      if: always()
      run: |
        echo "=== Buildozer Log (last 300 lines) ==="
        tail -300 buildozer_log.txt 2>/dev/null || echo "No log file"
        echo ""
        echo "=== Searching for APK files ==="
        find . -name "*.apk" 2>/dev/null || echo "No apk found"
        ls -la bin/ 2>/dev/null || echo "No bin directory"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: xuexiliankao-apk
        path: |
          bin/*.apk
          **/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: |
          buildozer_log.txt
