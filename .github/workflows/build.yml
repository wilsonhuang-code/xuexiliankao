name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev libltdl-dev \
          openjdk-17-jdk-headless \
          gcc g++ make patch \
          ccache

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer "cython>=0.29,<0.30"

    - name: Set up Android SDK / NDK
      id: setup-android
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses & install build-tools
      run: |
        SDK_ROOT=${{ steps.setup-android.outputs.sdk-root }}
        # Accept all licenses (retry to ensure all are accepted)
        for i in 1 2 3; do
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$SDK_ROOT > /dev/null 2>&1 || true
        done
        # Explicitly install build-tools (buildozer needs aidl from this)
        yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" --sdk_root=$SDK_ROOT 2>&1 || true
        echo "Installed packages:"
        ls $SDK_ROOT/build-tools/ 2>/dev/null || echo "No build-tools installed"

    - name: Build APK with Buildozer
      timeout-minutes: 60
      run: |
        export ANDROID_HOME=${{ steps.setup-android.outputs.sdk-root }}
        export ANDROID_SDK_ROOT=${{ steps.setup-android.outputs.sdk-root }}
        export ANDROID_NDK_HOME=${{ steps.setup-android.outputs.sdk-root }}/ndk/$(ls ${{ steps.setup-android.outputs.sdk-root }}/ndk/ | head -1)
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        # Verify NDK exists
        if [ ! -d "$ANDROID_NDK_HOME" ]; then
          echo "ERROR: NDK not found at $ANDROID_NDK_HOME"
          ls ${{ steps.setup-android.outputs.sdk-root }}/ndk/
          exit 1
        fi
        # Verify build-tools
        if [ ! -d "$ANDROID_HOME/build-tools" ] || [ -z "$(ls $ANDROID_HOME/build-tools/ 2>/dev/null)" ]; then
          echo "ERROR: build-tools not found"
          ls $ANDROID_HOME/
          exit 1
        fi
        echo "Build tools available:"
        ls $ANDROID_HOME/build-tools/
        # Clean previous build
        rm -rf .buildozer/bin/
        # Build
        buildozer android debug 2>&1 | tee buildozer_log.txt
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "Buildozer exit code: $BUILD_EXIT"
        exit $BUILD_EXIT

    - name: Check build result
      if: always()
      run: |
        echo "=== Buildozer Log (last 150 lines) ==="
        tail -150 buildozer_log.txt 2>/dev/null || echo "No log file"
        echo ""
        echo "=== bin directory ==="
        find . -name "*.apk" 2>/dev/null || echo "No apk files found anywhere"
        ls -la bin/ 2>/dev/null || echo "No bin directory"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: xuexiliankao-apk
        path: |
          bin/*.apk
          **/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: |
          buildozer_log.txt
          .buildozer/
